<!DOCTYPE html>
<html>
<body>
  <h2>Upload ZIP File</h2>

  <!-- Dropdown untuk memilih server -->
  <label for="server">Choose Server:</label><br>
  <select id="server" onchange="updateAction('zipForm')">
    <option value="http://127.0.0.1:5000">Localhost (127.0.0.1)</option>
    <option value="http://172.15.3.24:5000">Network (172.15.3.24)</option>
  </select><br><br>

  <!-- Form untuk upload ZIP -->
  <form id="zipForm" method="POST" enctype="multipart/form-data">
    <label for="zip_file">Select ZIP File:</label><br>
    <input type="file" id="zip_file" name="zip_file"><br>
    <label for="custom_class_name">Custom Class Name:</label><br>
    <input type="text" id="custom_class_name" name="custom_class_name" value="my_class"><br><br>
    <input type="submit" value="Upload ZIP">
  </form>

  <!-- JavaScript untuk mengubah 'action' form -->
  <script>
    function updateAction(formId) {
      const server = document.getElementById("server").value;
      document.getElementById(formId).action = server + "/api/upload/zip";
    }

    // Set default action ketika halaman dimuat
    window.onload = function() {
      updateAction('zipForm');
    };
  </script>
</body>
</html>
